name: Deploy

# local → push to GitHub → (CI green on main) → this workflow → server pulls the commit and deploys.
# The server is reached over SSH with a deploy key; it fetches the code from GitHub itself.
#
# Setup (once, see docs/DEPLOY.md): secrets DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY,
# DEPLOY_KNOWN_HOSTS. Run it by hand with mode "diff" first; automatic deploys after CI start
# only when the repository variable DEPLOY_ENABLED is "true".

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "diff = report what would change (touches nothing); deploy = backup, update, build, restart"
        type: choice
        options: [diff, deploy]
        default: diff
      ref:
        description: "commit or branch to deploy (default: main)"
        required: false
        default: main

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'deploy' }} → server
    # automatic: only after a green CI on main, and only once deploys are switched on
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && vars.DEPLOY_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    steps:
      - name: Resolve commit
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref || 'main' }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -n "$RUN_SHA" ]; then sha="$RUN_SHA"; else
            sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${REF}" --jq .sha)"
          fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "bad sha: $sha"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.commit.outputs.sha }}

      - name: Check secrets
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          missing=""
          [ -n "$HOST" ] || missing="$missing DEPLOY_HOST"
          [ -n "$USER" ] || missing="$missing DEPLOY_USER"
          [ -n "$KEY" ] || missing="$missing DEPLOY_SSH_KEY"
          [ -n "$KNOWN" ] || missing="$missing DEPLOY_KNOWN_HOSTS"
          if [ -n "$missing" ]; then echo "::error::missing secrets:$missing (see docs/DEPLOY.md)"; exit 1; fi

      - name: SSH key (host key pinned, no trust-on-first-use)
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts

      - name: Run on server
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'deploy' }}
          SHA: ${{ steps.commit.outputs.sha }}
          # where the suite lives on the server (repository variable; /opt/pushrsp by default)
          ROOT: ${{ vars.DEPLOY_ROOT || '/opt/pushrsp' }}
        # The deploy runs detached on the server (setsid + log file); this step only starts it and
        # then follows the log over short SSH calls, so a dropped connection can't kill a build
        # half-way (it did, on the first deploy to the shared server).
        run: |
          remote() {
            local tries=0
            until ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=20 \
                -o ServerAliveInterval=15 -o ServerAliveCountMax=4 "$USER@$HOST" "$@"; do
              tries=$((tries + 1))
              [ "$tries" -lt 5 ] || return 1
              sleep $((tries * 5))
            done
          }
          job="$ROOT/.deploy/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          remote "mkdir -p '$ROOT/.deploy' && cat > '$job.sh'" < scripts/deploy/server-deploy.sh
          remote "setsid bash -c 'bash $job.sh $MODE $SHA $ROOT > $job.log 2>&1; echo \$? > $job.exit' < /dev/null > /dev/null 2>&1 &"
          echo "started on the server: $job.log"
          shown=0
          for _ in $(seq 1 240); do          # up to ~40 min
            sleep 10
            # the server reports: exit code (if done), log size, then the new part of the log
            out="$(remote "c=\$(cat '$job.exit' 2>/dev/null); n=\$(wc -c < '$job.log' 2>/dev/null || echo 0); echo \"\$c|\$n\"; head -c \"\$n\" '$job.log' 2>/dev/null | tail -c +$((shown + 1))")" || continue
            head_line="${out%%$'\n'*}"
            code="${head_line%%|*}"
            size="${head_line##*|}"
            rest=""
            [ "$out" = "$head_line" ] || rest="${out#*$'\n'}"
            [ -z "$rest" ] || printf '%s\n' "$rest"
            shown="${size:-$shown}"
            if [ -n "$code" ]; then
              echo "server deploy finished with exit code $code"
              exit "$code"
            fi
          done
          echo "::error::no result from the server after 40 minutes (log: $job.log)"
          exit 1

      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/deploy_key
