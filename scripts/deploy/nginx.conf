# PushRSP suite — the only thing the pushrsp-proxy container serves (no default :80 server).
# Installed on every deploy by server-deploy.sh (placeholders __PORT__, __MARKET_PORT__,
# __PORTFOLIO_PORT__); the container mounts the suite root read-only at /srv.
#
# The national filter on the server's network answers any plain-HTTP request whose URL contains
# "chunks" with a redirect to its block page — and Next.js serves every script and stylesheet
# from /_next/static/chunks/. So the browser never sees that word: chunk files are served from
# /_next/static/c/ (straight from disk) and every "static/chunks/" in HTML, JS, CSS and RSC
# responses is rewritten to match. Drop this once the site runs on HTTPS (URLs are encrypted).
server {
    listen __PORT__;
    server_name _;
    client_max_body_size 25m;
    server_tokens off;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    # plain responses from the apps so sub_filter can rewrite them; nginx compresses instead
    proxy_set_header Accept-Encoding "";

    sub_filter_types text/css application/javascript text/javascript text/x-component application/json text/plain;
    sub_filter_once off;
    sub_filter "static/chunks/" "static/c/";

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript text/x-component application/json text/plain image/svg+xml;

    location = / { return 302 /pushrsp; }

    location ~ ^/pushrsp/_next/static/c/([A-Za-z0-9._~-]+)$ {
        alias /srv/app/.next/static/chunks/$1;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
    }
    location ~ ^/portfolio/_next/static/c/([A-Za-z0-9._~-]+)$ {
        alias /srv/portfolio-web/.next/static/chunks/$1;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
    }

    location /pushrsp { proxy_pass http://127.0.0.1:__MARKET_PORT__; }
    location = /portfolio-admin { return 301 /portfolio-admin/; }
    location /portfolio-admin/ {
        alias /srv/portfolio-admin/dist/;
        try_files $uri $uri/ /portfolio-admin/index.html;
    }
    location /portfolio { proxy_pass http://127.0.0.1:__PORTFOLIO_PORT__; }

    # static files served without the apps' basePath (as on the original server)
    location /images/ { alias /srv/app/public/images/; }
    location /downloads/ { alias /srv/app/public/downloads/; }
    location /covers/ { alias /srv/portfolio-web/public/covers/; }
    location /avatars/ { alias /srv/portfolio-web/public/avatars/; }
}
